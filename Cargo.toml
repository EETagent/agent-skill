[package]
name = "agent-skill"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cross-platform CLI and Ratatui manager for agent skills"
license = "MIT"

[[bin]]
name = "skillctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0"
pulldown-cmark = "0.13"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
syntect = { version = "5.3", default-features = false, features = ["default-onig"] }
tempfile = "3.27"
url = "2.5"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
